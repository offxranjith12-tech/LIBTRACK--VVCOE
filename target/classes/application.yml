server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: libtrack-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:libtrack}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ranjith64}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # 'update' auto-creates/updates tables on boot — convenient for first run.
      # Switch to 'validate' once you introduce a real migration tool (Flyway/Liquibase).
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET:libtrack-super-secret-key-change-this-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

libtrack:
  default-admin:
    id: ${DEFAULT_ADMIN_ID:VVCE-LIB-ADM-001}
    password: ${DEFAULT_ADMIN_PASSWORD:ChangeMe@123}
  uploads:
    # Where profile-picture uploads are stored on disk; served back at /uploads/**.
    # Mount this as a volume in Docker so avatars survive container restarts.
    dir: ${UPLOADS_DIR:./uploads}

logging:
  level:
    com.vvce.libtrack: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: libtrack-backend

  datasource:
    url: jdbc:mysql://localhost:3306/libtrackstaff_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

# JWT settings
libtrack:
  jwt:
    secret: "CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_BEFORE_DEPLOYING_TO_PRODUCTION"
    expiration-ms: 86400000

  fine:
    per-day-rupees: 5

  borrow:
    default-loan-days: 14

logging:
  level:
    com.vvce.libtrack: INFO
name: libtrack_staff
description: LibTrack — Staff Module (V V College of Engineering Library Management System)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking — wired to the Spring Boot REST API in /libtrack_backend
  dio: ^5.4.3+1

  # JWT storage
  flutter_secure_storage: ^9.2.2

  # Dashboard charts
  fl_chart: ^0.68.0

  # Dark mode persistence
  shared_preferences: ^2.3.2

  # URL & phone/email launcher
  url_launcher: ^6.3.1

  # Profile picture picking
  image_picker: ^1.1.2

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

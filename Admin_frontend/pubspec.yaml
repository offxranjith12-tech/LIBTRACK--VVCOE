name: libtrack_admin
description: "LibTrack - Library Management System | Admin Module for V V College of Engineering"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # Authentication
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.2.4

  # QR / Barcode
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0

  # PDF / Export
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2

  # Charts
  fl_chart: ^1.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0

  # File Upload
  file_picker: ^10.3.2

  # UI
  google_fonts: ^6.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  fluttertoast: ^8.2.12
  shared_preferences: ^2.5.3
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
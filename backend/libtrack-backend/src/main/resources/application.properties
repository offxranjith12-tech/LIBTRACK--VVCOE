spring.application.name=libtrack-backend
server.port=8080

# --- MySQL 8 connection ---
# Update the username/password to match your local MySQL installation.
# createDatabaseIfNotExist=true means you do NOT need to manually create the
# libtrack_db schema - it will be created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/libtrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update automatically creates/updates tables to match the entities
# below - no manual SQL schema needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- File uploads (profile photos, book covers) ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Jackson ---
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

name: libtrack
description: "LibTrack - Student Module for VV College of Engineering Library Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Fonts / typography
  google_fonts: ^6.2.1

  # Networking (ready for Spring Boot REST API + JWT)
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1
  file_picker: ^8.0.5
  path_provider: ^2.1.3

  # Dashboard charts
  fl_chart: ^0.68.0

  # Profile photo selection
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
